name: MIB tenders
on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 min (GitHub may delay runs)
  workflow_dispatch:
permissions:
  contents: write
concurrency: tenders
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 mibtenders.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen tenders" && git push)
